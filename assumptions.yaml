# 数値前提（AIが計算・比較に使うデフォルト値）
# 出典: 『住宅購入の思考法』（江口亮介, 2024）のシミュレーション前提を基に、2026年時点で見直したもの。
# 「見直し要」の項目は、回答時に最新値を利用者に確認するか、Web検索で更新すること。
updated_at: 2026-09-17

interest_rate:
  simulation_default_pct: 1.0        # 本書の前提（物価一定・金利1.0%）。単独で使わず、必ず実勢金利との2本立てで示す
  note: "変動・固定の実勢金利は2024年以降上昇している。回答時は最新値を確認すること（見直し要）"
  must_show_two_rates: "本書の1.0%と、回答時点の実勢金利の2本を必ず並べる。1.0%だけで示すと購入側が有利に出る（金利2.5%では分岐が後ろにずれる）"
  scenario_link: "金利を動かすときは inflation.scenarios のセットで動かす。金利だけ上げて賃料・物価・物件価格を据え置くのは整合しない前提"
  screening_rate_pct: 3.0            # 審査金利。銀行が返済比率を計算するときに用いる仮の金利（3〜4%が一般的）
  screening_rate_note: "見直し要。銀行ごとに異なる"

inflation:                           # 本書外の追加論点。計算はすべて名目で行い、金利・賃料・保有コスト・物件価格を同じ世界観でそろえるために使う
  simulation_default_pct: 1.0        # 標準の物価上昇率（年率）
  rule: "金利が高いのは物価が上がっているからで、そのときは賃料・管理費・修繕費・物件価格も名目で上がる。金利だけ上げて他を据え置くと、購入側だけが不利になる整合しない比較になる"
  scenarios:                         # 3セットを必ず並べる。セット内の数値を単独で入れ替えない
    low:    {inflation_pct: 0.0, interest_rate_pct: 1.0, rent_growth_pct: 0.0, management_fee_growth_pct: 0.0, repair_reserve_growth_pct: 2.0}
    medium: {inflation_pct: 1.0, interest_rate_pct: 1.5, rent_growth_pct: 1.0, management_fee_growth_pct: 0.5, repair_reserve_growth_pct: 3.0}
    high:   {inflation_pct: 2.0, interest_rate_pct: 2.5, rent_growth_pct: 2.0, management_fee_growth_pct: 1.0, repair_reserve_growth_pct: 4.0}
  scenarios_note: "low は本書の前提（物価一定・金利1.0%）。medium・high の金利は実勢の水準に合わせて回答時に更新する（見直し要）"
  price_pass_through_pct: 100        # 物価上昇が物件価格に波及する割合。標準は100%
  price_pass_through_note: "インフレ下で購入が有利に出るかを決める最大の分岐。波及率0%（物価が上がっても価格が上がらない）も必ず並べる。人口が減るエリアでは波及率は低い。エリアの優劣は断言しないが、波及率の前提が結論を左右することは必ず伝える"
  nominal_price_formula: "N年後の名目価格 = 物件価格 × (1 − 経年減価率)^N × (1 + インフレ率 × 波及率)^N"
  rent_stickiness_note: "日本では物価が上がっても家賃が上がりにくい時期があった（消費者物価指数の家賃はほぼ横ばい）。物価上昇率より低い賃料上昇率（例 物価2.0%・賃料0.5%）のケースも示す"
  loan_note: "インフレは固定金利の借入の実質負担を軽くする。ただし変動金利で借りていれば返済額そのものが増えるので、この効果は固定金利を前提とした話だと明示する"
  discounting: "現在価値への割引は行わない。双方の名目キャッシュフローを同じ年数で積み上げて比べる。割引率を置くと結論が割引率に依存するため"
  income_note: "予算算定では収入据え置き（悲観シナリオ）で見る。これは家計のストレステストであり、比較シミュレーションの物価前提とは目的が違う。混在させず、どちらの話をしているか明示する"

loan:
  default_term_years: 35             # 通常35年、最長50年。80歳までの完済が通常（本書付録Excel）。短縮は繰上返済で後から実現できる（本書外の追加論点）
  repayment_ratio_limit_pct: 35      # 返済比率の上限（年収400万円以上の一般的な審査基準）。借りるべき額ではない
  income_multiple_lendable: "7〜8倍（最大9〜10倍）"   # 借りられる額の目安。借りるべき額ではない
  income_multiple_caution: "考えなしに年収7〜8倍を組むと将来苦しくなる水準として本書は扱う"
  pair_loan_ratio_recommended: "7:3 または 8:2"         # 限度額いっぱいの5:5は避ける
  origination_fee_pct: 2.2           # ローン事務手数料（借入額に対する定率型の一般値、税込）
  low_fee_type_rate_premium_pct: 0.25  # 定額型（低初期費用）は金利が約0.25%上乗せ。約7年未満で売却なら定額型が有利（第6章。第3章は10年。要試算）
  term_shortening_breakeven: "借入期間の短縮は『ローン金利と同じ利回りの確定運用』と等価。差額を運用して得になるかの分岐は、運用利回り（税引後。運用益に約20%課税）がローン金利を上回るかどうかだけで決まり、分岐は必ずローン金利に一致する。5,000万円・金利1.0%・15年目売却で検証（残債差1,724万円・追加支払1,598万円・正味125万円）。本書外の追加論点"
  term_shortening_deduction_note: "住宅ローン控除は年末残高の0.7%なので、残高が大きい長期のほうが控除額は多い。中古『その他の住宅』（限度2,000万円）では両者とも上限に張り付き差は出ないが、新築の認定住宅（限度4,500万円）では10年間で約39万円、35年のほうが多い（`tax_and_programs.mortgage_deduction`）"

  prepayment:                        # 繰上返済。「35年で組んで繰上返済」を対案に出すときに一言添える内容
    fee_note: "見直し要。ネット経由の一部繰上返済は無料の銀行が多いが、窓口・電話は有料のことがある。金額は銀行と手続き方法で変わるので、AIが具体額を断定しない"
    type_note: "期間短縮型は利息削減効果が大きいが、団信の保障期間も一緒に短くなる。返済額軽減型は毎月の負担を下げるが利息削減効果は小さい。目的が利息削減なら期間短縮型"
    how_to_mention: "対案として示すときに『繰上返済の条件は銀行で異なるので、借りる銀行を選ぶときに一緒に見ておいてください』と一言添える。手数料額・最低額・回数制限を利用者に尋ねて、回答を止めない"

purchase_costs:
  new_condo_pct: 4.5                 # 新築マンションの諸費用（4〜5%）
  used_or_house_pct: 7.5             # 新築戸建て・中古マンション・中古戸建て（7〜8%）
  simulation_default_pct: 7.0
  earnest_money_pct: 5.0             # 手付金の目安

selling_costs:                       # 売却時にかかる費用。本書付録Excelには含まれないが、手残りの計算では標準で差し引く
  brokerage_fee_formula: "(売却価格 × 3% + 6万円) × 1.1"   # 税込。売却価格400万円超の場合の上限額（400万円以下は別規定）
  other_costs_yen: 40000             # 抵当権抹消の登記費用・司法書士報酬・印紙、ローンの一括返済手数料など（3〜5万円）
  simulation_default_pct: 3.5        # 率で概算するときの既定値。5,000万円で3.51%
  rate_by_price_note: "率は価格帯でズレる（3,000万円で3.65%、5,000万円で3.51%、1.0億円で3.41%）。+6万円の影響が価格に反比例するため。金額を出せるなら brokerage_fee_formula + other_costs_yen で計算する"
  excluded: "譲渡益への課税（税理士へ）、ハウスクリーニング・残置物処分・引っ越し費用は含まない"

depreciation:                        # 市況変化なしの前提での物件価格下落率
  condo_pct_per_year: 1.5            # RC造47年・建物7割（首都圏）から算出。Excelの「中」シナリオ
  house_pct_per_year: 1.4            # 木造22年・建物3割（首都圏）から算出
  scenarios:                         # 本書付録Excelの3シナリオ。必ず3つ並べて示す
    small_pct_per_year: 1.0
    medium_pct_per_year: 1.5
    large_pct_per_year: 4.0
  basis:
    condo_land_ratio: 0.3
    house_land_ratio: 0.7
    rc_useful_life_years: 47
    wood_useful_life_years: 22

ownership_costs:                     # 本書付録Excel「2) 購入vs賃貸シミュレーション」の初期値
  condo_management_fee_yen_per_month: 14000   # 管理費（月）。5000万円の都市部ファミリーマンションの例
  condo_repair_reserve_yen_per_month: 14000   # 修繕積立金（月）
  management_fee_growth_pct_per_year: 0.5     # 管理費の上昇率（名目）。人件費で上がるが、実勢では据え置く管理組合が多く、物価上昇率の半分程度で置く（打ち合わせ仮定）
  management_fee_growth_note: "本書付録Excelは管理費を据え置いている。据え置くと購入側が有利に出るため標準で上昇させるが、実勢はあまり上がらないので物価上昇率と同率では置かない"
  repair_reserve_growth_pct_per_year: 3.0     # 修繕積立金の上昇率（名目、標準セット）。Excel初期値と同じ
  repair_reserve_real_growth_pct_per_year: 2.0  # うち築年進行による段階増額分（実質）。名目 = この値 + インフレ率
  property_tax_yen_per_year: 120000           # 固定資産税。都市部のファミリーマンションで年10〜20万円
  condo_fixed_costs_yen_per_year: 350000      # 上記を合算した簡略値（本書「はじめに」のシミュレーションでは固定）
  renovation_yen_per_10years: 1000000         # 10年に1度100万円

rent:                                # 本書付録Excelの賃貸モデル（住み替えで賃料が変わる）に、賃料上昇率を追加したもの
  renewal_fee_months: 1              # 2年（24カ月）ごとに賃料1カ月分。賃料が上がれば更新料も上がる
  renewal_interval_months: 24
  initial_cost_months: 4.5           # 住み替え時の初期費用（敷金・礼金・仲介手数料など）。賃料の4〜5カ月分

  # --- 比較に使う賃料の決め方（購入側と釣り合わせるための最重要項目） ---
  comparable_rent_source_priority:   # 上から順に使う。1が使えるなら2・3を使わない
    - "検討物件と同等（同じエリア・広さ・間取り・築年帯）の募集賃料を3件以上調べた中央値"
    - "同じマンション・同じ棟の賃貸募集事例"
    - "物件価格 × comparable_rent_ratio_pct_of_price_per_year ÷ 12（仮置き。仮置きだと明示する）"
  comparable_rent_listings_min: 3    # 相場として扱うのに最低限調べる募集件数
  comparable_rent_ratio_pct_of_price_per_year: 3.8   # 仮置き目安（物件価格に対する年率）。本書付録Excelの初期値（5,000万円・月16万円）の比率。本書外の追加論点
  comparable_rent_ratio_note: "この比率は価格が高いエリアほど実勢より低く出やすく、賃料を過小に置く方向に働く。仮置きを使ったら必ず募集賃料で検算する（見直し要）"
  current_rent_usage: "今住んでいる家賃は『今の住居費』として別枠で扱い、賃貸か購入かの比較の賃料には使わない。今の家を出ない選択肢を示すときだけ、別の比較として並べる"

  # --- 賃料上昇率（本書付録Excelには無い追加論点。打ち合わせで置いた仮定） ---
  growth_pct_per_year: 1.0           # 標準ケース。賃料・更新料・住み替え後の賃料・住み替え時の初期費用のすべてに同じ率をかける
  growth_scenarios:                  # 賃貸側は必ず3つ並べる（購入側の下落率3シナリオと対になる）
    flat_pct_per_year: 0.0           # 横ばい。過去30年の日本の平均的な姿に近い
    medium_pct_per_year: 1.0         # 標準
    high_pct_per_year: 2.0           # 都市部で賃料上昇が続く場合
  growth_note: "見直し要。消費者物価指数の家賃は長期的にほぼ横ばいだが、2020年代の都市部の募集賃料は上昇している。回答時に最新の賃料指数・募集賃料を確認すること"
  growth_coupling_note: "賃料の上昇と物件価格は利回りで結びついている。賃料上昇 2%/年と価格下落 大（4%/年）を同時に置くのは整合しない。賃料上昇を高く置くなら価格下落は小〜中で見る"

  example_moves:                     # Excel初期値の住み替え例。金額は「今の相場」ベースで、その年の賃料には growth を別途かける。利用者の予定で上書きする
    - {after_years: 5, rent_yen_per_month: 180000}    # 家族が増えて広くする
    - {after_years: 20, rent_yen_per_month: 140000}   # 子供が独立して小さくする
  example_moves_note: "この例は20年後に賃料が下がる（縮小する）前提なので、住み替え予定を聞かずに使うと賃貸側を安く見せる。住み替えの予定と広さは必ず利用者に確認する"

danshin:                             # 団体信用生命保険。購入側にだけ付く保障なので、比較では賃貸側に同等保障の費用を立てる（本書外の追加論点）
  equivalent_premium_yen_per_month: 3000   # 残債と同等の死亡保障を別に買う場合の保険料の目安（30〜40代・残高5,000万円の逓減定期保険）
  note: "見直し要。年齢・性別・健康状態で大きく変わるので、利用者の実額があればそれを使う"
  double_count_guard: "既に生命保険に加入している人は、団信で減額できる分だけを価値として数える。保障を二重に積まない"
  optional_danshin_note: "フラット35など団信が任意のローンでは別途特約料がかかる。その場合は賃貸側に立てず、購入側のコストに計上する"
  not_a_reason_to_buy: "団信は購入の付帯効果であって購入理由ではない（principles/05-danshin-and-costs.md）。金額を出しても『保険目的で買う』方向には使わない"

holding:
  minimum_years_to_buy: 5            # 本書第2章「買ったほうがいい人」の3条件の1つ。諸費用7%を回収できないため、5年未満で手放す見込みなら購入を勧めない
  recommended_min_years: 7           # 本書外。標準セットで購入の純負担が賃貸を下回る年。購入を前向きに考えるならこの年数以上の居住見通しを条件にする
  recommended_min_years_note: "7年は金利1.0〜1.5%・物価0〜1.0%のセットでの分岐。金利2.5%・物価2.0%のセットなら5年目に早まるが、物価が物件価格に波及しなければ14年目、賃料も上がらなければ35年目まで後ろにずれる。年数は前提とセットで示す"
  
  wait_breakeven_drop_pct_per_year: 3.6   # 家賃180万円/年÷5000万円。待って得するには年5%以上の下落が必要
  historical_max_drop_pct: 6.3       # 首都圏中古マンション、リーマンショック時（2008年5月→2009年4月）

tax_and_programs:                    # 制度は年度ごとに変わる。回答時に必ず最新値を確認する（見直し要）
  checked_at: 2026-09-17             # 下記の内容を確認した日
  stance: "控除・補助は『原則として使える前提』で案内し、使えなくなる条件を並べて、適用の確定は税理士・金融機関・自治体への相談に回す。『使えます』とも『使えません』とも断定しない"

  mortgage_deduction:                # 住宅ローン控除（2026年＝令和8年入居の制度。租税特別措置法第41条）
    rate_pct: 0.7                    # 年末ローン残高に対する控除率
    period_years: 13                 # 原則13年
    period_years_other_housing: 10   # 省エネ基準に適合しない既存住宅（「その他の住宅」）は10年
    deadline: "2030年12月31日までの入居分（令和8年度税制改正で5年延長）"
    limit_new_man_yen:               # 新築・買取再販の借入限度額（単位 万円）。2026〜2027年入居
      {certified: 4500, zeh: 3500, energy_saving: 2000}
    limit_new_child_man_yen:         # 同、子育て世帯・若者夫婦世帯の上乗せ後（単位 万円）
      {certified: 5000, zeh: 4500, energy_saving: 3000}
    limit_used_man_yen:              # 既存住宅（中古）の借入限度額（単位 万円）
      {certified_or_zeh: 3500, energy_saving: 2000, other: 2000}
    limit_used_child_man_yen:
      {certified_or_zeh: 4500, energy_saving: 3000}
    child_household: "19歳未満の子がいる世帯、または夫婦のいずれかが40歳未満の世帯"
    income_limit_man_yen: 2000       # 合計所得金額の上限。超えた年は適用なし
    income_limit_small_area_man_yen: 1000   # 床面積40〜50㎡の住宅を使う場合の上限
    min_area_sqm: 50
    min_area_sqm_special: 40         # 40〜50㎡は所得1,000万円以下の年だけ適用。子育て世帯の上乗せは使えない
    used_housing_age_rule: "1982年1月1日以降に建築、または耐震基準適合証明を取得。旧耐震（`seismic.old_standard_cutoff`）は証明がなければ対象外"
    not_applicable:                  # 「使えない」ほうの条件。相談者に当てはまるか確認する
      - "合計所得金額が2,000万円を超える年（その年だけ適用なし）"
      - "床面積が50㎡未満（40〜50㎡は所得1,000万円以下の年のみ）"
      - "旧耐震で耐震基準適合証明がない中古"
      - "省エネ基準に適合しない新築（一定の経過措置を除く）"
      - "取得から6カ月以内に入居していない"
      - "セカンドハウス・投資用・親族間売買など居住・取引の要件を満たさないもの"
    simulation_default_man_yen_per_year: 14   # シミュレーションの既定値。中古「その他の住宅」の限度2,000万円 × 0.7% = 14万円
    simulation_default_years: 10              # 同、10年。省エネ基準適合の証明があれば13年で再計算する
    sources:
      - "https://www.zeitax.jp/ownersvision/2026/05/26/"
      - "https://jitsumu-guide.com/mortgage-deduction-guide-2026/"

  subsidies:                         # 補助金。予算上限に達すると年度内でも受付終了するため、必ず公式サイトで最新の受付状況を確認する
    new_construction: "住宅省エネ2026キャンペーン「みらいエコ住宅2026事業」（国土交通省ほか3省連携）。第2期の申請期間は2026年5月13日〜12月31日（注文住宅の長期優良・ZEH水準は9月30日まで）。予算上限に達し次第終了。補助額と対象住宅の性能区分は公式サイトで確認する（https://mirai-eco2026.mlit.go.jp/）"
    local: "自治体独自の補助（新婚・子育て世帯向け、移住支援、省エネ改修など）は市区町村ごとに条件も予算も違う。『自治体の補助があるかもしれないので、市区町村の住宅課に確認を』と案内し、金額は断定しない"
    note: "見直し要。補助事業は年度で名称も要件も変わる。事業名を断定する前に公式サイトの存在を確認する"

  gift_tax_exemption:                # 住宅取得等資金に係る贈与税の非課税措置
    limit_man_yen: {quality_housing: 1000, other: 500}   # 質の高い住宅1,000万円、それ以外500万円（単位 万円）
    basic_deduction_man_yen: 110     # 暦年課税の基礎控除。合わせて最大1,110万円
    deadline: "2026年12月31日までの贈与（延長されるかは未確定。年内の贈与を検討している人には期限が近いことを伝える）"
    donor: "直系尊属（父母・祖父母）からの贈与"
    note: "見直し要。適用には申告が必要で、要件の確定は税理士・税務署へ"

investment:                          # 自宅購入が合わない人の与信の使い道（principles/10-credit-and-investment.md）。全体が本書外の追加論点
  scope: "渡すのは判断の枠組みと確認事項だけ。個別物件の利回り査定、特定の不動産会社・商品・スキームの評価はしない（principles/99-out-of-scope.md）"
  stance: "「与信がもったいないから借りる」方向には押さない。投資・金融資産・本業への投資・与信を使わないの4つを同じ格で並べる"
  housing_loan_rule: "住宅ローンで投資用物件を買う、賃貸に出す前提で住宅ローンを組むのは契約違反。どんな条件でも勧めない（本書第6章）"
  loan_difference: "投資は不動産投資ローン（アパートローン）。住宅ローンより金利が高く、期間・自己資金・審査の見方も違う。水準は属性と時期で大きく変わるので数値を持たず、金融機関に確認させる"
  loan_order: "投資用ローンの債務と返済は住宅ローン審査の返済比率に乗る。逆に住宅ローンがあると投資用の枠が減る。自宅を買う可能性が残っているなら順序を先に決め、両方の可能性を金融機関に事前相談させる"
  net_yield_formula: "実質利回り =（年間家賃 ×(1 − 空室率) − 運営費）÷（物件価格 + 購入諸費用）。表面利回りで判断させない"
  operating_cost_ratio_pct: "15〜20"   # 運営費（管理委託費・共用部光熱・修繕・固定資産税など）の家賃収入に対する割合の目安。見直し要
  vacancy_loss_pct: "5〜10"            # 空室・滞納の見込み。年間家賃に対する割合の目安。見直し要
  stress_test: "金利+2.0%、空室率20%、家賃10%下落のそれぞれでキャッシュフローが回るか、売却しても残債が残らないかを見る。通らないなら「やらない」が答え"
  exit: "手残りは 売却価格 − 残債 − 売却諸費用 − 税。自宅と違い譲渡益に課税され、減価償却を取った分だけ簿価が下がって譲渡益が膨らむ。税の確定は税理士へ"
  tax_caution: "「節税になる」と断言しない。減価償却での圧縮は売却時の譲渡益に跳ね返るため、通算の損得は税理士と試算しないと言えない"

market_data:                         # 相場の実績を答えるときに使う一次データ。数値はここに焼き込まず、回答時に出典元で確認する
  stance: "過去から現在までの相場（実績）は、出典を示して答える。断らない。断るのは将来予測とエリアの優劣だけ（principles/99-out-of-scope.md）"
  sources:
    reins: "レインズ（公益財団法人 東日本不動産流通機構）月例速報 Market Watch。首都圏の中古マンション・中古戸建の成約価格・成約㎡単価・成約件数・新規登録・在庫の月次統計。季報もある。https://www.reins.or.jp/library/"
    kantei: "東京カンテイ 市況レポート。70㎡換算価格推移、価格天気図、賃料月別推移、一戸建て価格推移、沿線別・駅別価格。首都圏・近畿圏・中部圏・主要都市。https://www.kantei.ne.jp/report/"
    mlit_price_index: "国土交通省 不動産価格指数。全国・ブロック別の住宅／商業用の価格指数（月次・四半期）。https://www.mlit.go.jp/totikensangyo/totikensangyo_tk5_000085.html"
    mlit_reinfolib: "国土交通省 不動産情報ライブラリ。実際の取引価格、地価公示・都道府県地価調査、ハザードマップ、都市計画。https://www.reinfolib.mlit.go.jp/realEstatePrices/"
  contract_vs_listing: "レインズは成約価格（実際に売れた価格）、ポータルサイトは売出価格（売主の希望額）。売出価格で相場を語らない。『値下がりしている』という話は売出価格や特定の1棟の話であることが多いので、成約ベースの統計で確かめる"
  usage: "回答時点で出典元を確認し、『どの統計の、いつ時点の数字か』を必ず明示する。この前提ファイルに具体的な数値を書き込まない（すぐ古くなるため）"
  limit: "実績を示すことと、そこから将来を外挿することは別。エリア別の実績を示してもよいが、エリアの優劣や今後の値動きは判断しない（principles/99-out-of-scope.md）"

space:
  child_additional_sqm: "10〜15㎡/人"
  urban_guideline: "都市居住型: 単身40㎡、2人以上は 20㎡×世帯人数＋15㎡（10歳未満の子は0.25〜0.75人換算）"
  general_guideline: "一般型: 単身55㎡、2人以上は 25㎡×世帯人数＋25㎡"

seismic:
