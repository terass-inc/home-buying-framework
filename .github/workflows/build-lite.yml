name: build lite
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate dist/lite.md and check size
        run: python3 scripts/build_lite.py
      - name: Fail if dist/lite.md or README.md is stale
        run: git diff --exit-code -- dist/lite.md README.md
