name: build lite
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Regenerate dist/lite.md and check size
        run: python3 scripts/build_lite.py
      - name: Fail if generated files are stale
        run: git diff --exit-code -- dist/lite.md README.md docs/llms.txt docs/llms-full.txt
      - name: Check assumptions.yaml (references, ranges, freshness)
        run: |
          pip install pyyaml==6.0.2
          python3 scripts/check_assumptions.py
      - name: Unit tests (calculation engine, eval parser, MCP server)
        run: |
          pip install "mcp>=2,<3"
          python3 -m unittest discover -s scripts/tests -v
      - name: Package the MCP server and run it from the bundled data
        run: |
          pip wheel . --no-deps -w /tmp/wheel
          python3 -m venv /tmp/hbf && /tmp/hbf/bin/pip install /tmp/wheel/*.whl
          cd /tmp && /tmp/hbf/bin/python -I -c "import hbf_mcp.server as s, hbf_mcp.paths as p; assert '_data' in str(p.ROOT); print(s.report.to_markdown(s.report.diagnose(s.consult.Facts(property_price_yen=50_000_000)))[:200])"
      - name: Audit pinned dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r scripts/hbf_mcp/requirements.txt -r scripts/eval/requirements.txt
